name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        env:
          PROTOC_VERSION: "35.1"
        run: |
          curl -sSL -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q protoc.zip -d "$HOME/.local/protoc"
          chmod +x "$HOME/.local/protoc/bin/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Reported only, not gated — a starting coverage baseline, not a
      # merge blocker. cargo-llvm-cov re-runs the test binaries under
      # instrumentation; --ignore-filename-regex keeps generated/vendored
      # code out of the number.
      - run: cargo llvm-cov --summary-only
