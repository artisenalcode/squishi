[package]
name = "squishi"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
regex = "1"
serde_json = { version = "1", features = ["raw_value"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["download-binaries", "tls-rustls", "std"] }
hf-hub = { version = "=0.5.0", default-features = false, features = ["rustls-tls", "ureq"] }
tokenizers = "=0.22.2"

magika = "1.1.0"
dirs = "6.0.0"
spleen-font = { version = "0.2.0", features = ["s5x8"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
clap_mangen = "0.3.3"

[dev-dependencies]
tempfile = "3.27.0"
