[package]
name = "squishi"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
regex = "1"
serde_json = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["download-binaries", "tls-rustls", "std"] }
hf-hub = { version = "=0.5.0", default-features = false, features = ["rustls-tls", "ureq"] }
tokenizers = "=0.22.2"

[dev-dependencies]
tempfile = "3.27.0"
